<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1.0, user-scalable=no">
	<title>Bioneer</title>
	<link rel="shortcut icon" href="img/favicon.ico">
	<link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.0.13/css/all.css" integrity="sha384-DNOHZ68U8hZfKXOrtjWvjxusGo9WQnrNx2sqG0tfsghAvtVlRW3tvkXWZh58N9jp" crossorigin="anonymous">
</head>
<style type="text/css">
	.mobile{
		display: none;
	}
	body{
                margin-top: 0px;	
		background-color: #f5f5f5;
	}
	a{
		text-decoration: none;
		color:#555;
	}
	.logo img{
		padding-top: 2.5vw;
                padding-left: 3vw;
                width: 10vw;
                position: absolute;
		background-color: transparent;
	}
	.main_image{
		text-align:center;
	}
        .main_image img {
                width: 43vw;
        }
	.text{
		text-align: center;
		font-weight: 700;
		margin-top: 3vw;
		font-size: 1.2vw;
		color:#555;
		font-family: sans-serif;
		animation: fadeIN 5s;
		letter-spacing: -1.2px;
	}
	.text span{
		font-size: 1.8vw;
		color: #8CC63E;
		font-family: sans-serif;
	}
	.language ul{
		width: 50%;
		height: 2vw;
		margin: 0 auto;
		margin-top:6vw;
                padding-left: 0%;
	}
	.language li{
		width: 20%;
		float: left;
		list-style: none;
		height: 2vw;
		margin-right: 6.25%;
		position: relative;
	}
	.language li:after {
		content: url('');
		height: 2vw;
                width: 41.7%; 
		position: absolute;
		left: 100%;
                background: url('img/line.png') no-repeat;
                background-size: cover;
	}
	.language li:nth-child(4):after {
		background: url();
	}
	.language li:nth-child(4){
		margin-right: 0;
	}
	.language li a{
		position: absolute;
		width: 100%;
		height: 100%;
		text-align:center;
		background-color: #acacac;
		line-height: 2vw;
		color: #fff;
		border-radius: 10px;
		font-size: 1vw;
		transition: 0.5s;
		font-family: sans-serif;
	}
	.language li a:hover{
		background-color: #27bdbe;
	}
        .copyright {
		text-align: center;
                font-family: sans-serif;
                background-color: transparent;
                font-size: 1vw;
                height: 2vw;
		color: #555;
		margin-top: 7vw;
        }

	@keyframes fadeIN
	{
		0%
		{
			opacity: 0;
		}
		100%
		{
			opacity: 1;
		}
	}
</style>
<link rel="stylesheet" href="css/media.css">
<script type="text/javascript">
   function handleSelect(elm)
   {
      window.location = elm.value;
   }
</script>
<body>
	<div >
		<div class="logo">
			<img src="img/logo.png" alt="">
		</div>
		<div class="pc main_image">
			<img src="img/circle.png">
		</div>
		<div class="mobile main_image">
			<img src="img/m_640_circle.png">
		</div>
		<div class="pc text">
			<span>"Healthier Future</span> for<br>Humanity with <span>Genomic Technology"</span>
		</div>
		<div class="pc language">
			<ul>
				<li><a href="https://us.bioneer.com/">USA & Canada</a></li>
				<li><a href="http://eng.bioneer.com/">International</a></li>
				<li><a href="http://www.bioneercn.com/">China</a></li>
				<li><a href="https://www.bioneer.co.kr/index.php/">Korea</a></li>
			</ul>
		</div>
		<div class="mobile m_language">
			<select onchange="javascript:handleSelect(this)">
				<option class="title">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;Language</option>
				<option value="https://us.bioneer.com/">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;USA & Canada</option>
				<option value="http://eng.bioneer.com/">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;International</option>
				<option value="http://www.bioneercn.com/">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;China</option>
				<option value="https://www.bioneer.co.kr/index.php/">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;Korea</option>
			</select>
		</div>
		<div class="copyright">Copyright ⓒ 2020 BIONEER CORPORATION. All rights reserved.</div>
	</div>
</body>
</html>
